name: Tokisclone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: pip install -r requirements-minimal.txt

      - name: Compile Python
        run: >-
          python -m py_compile
          server.py
          drive_storage.py
          authorize_drive.py
          run_server.py
          media_core.py
          dramafren_adapter.py
          dramafren_job.py
          dramafren_drive.py
          process_job.py
          local_worker.py

      - name: Smoke-test product invariants
        run: |
          python - <<'PY'
          import inspect
          import media_core

          assert media_core.MANDATORY_SOURCE_POLICY == "clean-only"
          selector = media_core.video_format_selector("best", "allow")
          assert "format_id!=download" in selector
          assert selector == media_core.video_format_selector("best", "prefer-clean")
          profile_source = inspect.getsource(media_core._extract_profile)
          assert '"playlistend"' not in profile_source
          print("Mandatory clean-only and all-public profile invariants OK")
          PY

      - name: Smoke-test DramaFren adapter
        run: |
          python - <<'PY'
          from dramafren_adapter import _episode_numbers_from_html, episode_url, parse_drama_ref
          from dramafren_drive import SOURCE_POLICY

          ref = parse_drama_ref(
              "https://dramabox.dramafren.org/index.php?ep=12&id=42000005228&lang=en&view=watch"
          )
          assert ref.drama_id == "42000005228"
          assert ref.lang == "en"
          assert "ep=64" in episode_url(ref, 64)
          episodes = _episode_numbers_from_html(
              "<p>Total: 64 Eps</p><a href='?ep=1&id=42000005228'>Ep 1</a>",
              ref.drama_id,
          )
          assert episodes == list(range(1, 65))
          assert SOURCE_POLICY == "direct-public-non-drm-only"
          print("DramaFren adapter smoke test OK")
          PY

      - name: Import and smoke-test MCP server
        run: |
          python - <<'PY'
          import server
          health = server.health()
          assert health["ok"]
          assert health["source_policy"] == "clean-only"
          assert health["profile_scope"] == "all_public"
          assert health["dramafren_source_policy"] == "direct-public-non-drm-only"
          assert health["dramafren_scope"] == "all_public_episodes"
          print("Tokisclone MCP import and health OK")
          PY

      - name: Import local worker
        run: python -c "import local_worker; print('Tokisclone local worker import OK')"
