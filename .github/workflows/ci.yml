name: Tokisclone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: pip install -r requirements-minimal.txt

      - name: Compile Python
        run: >-
          python -m py_compile
          server.py
          rest_api.py
          tiktok_portability.py
          drive_storage.py
          authorize_drive.py
          run_server.py
          start_worker.py
          media_core.py
          tokgrab.py
          process_job.py
          local_worker.py
          dramafren_drive_worker.py
          dramafren_bulk.py
          dramafren_queue.py
          library_db.py
          ingest_local_media.py

      - name: Smoke-test product invariants
        run: |
          python - <<'PY'
          import inspect
          import media_core

          assert media_core.MANDATORY_SOURCE_POLICY == "clean-only"
          selector = media_core.video_format_selector("best", "allow")
          assert "format_id!=download" in selector
          assert selector == media_core.video_format_selector("best", "prefer-clean")
          profile_source = inspect.getsource(media_core._extract_profile)
          assert '"playlistend"' not in profile_source
          print("Mandatory clean-only and all-public profile invariants OK")
          PY

      - name: Test tokgrab bulk downloader logic
        run: python test_tokgrab.py

      - name: Smoke-test authorized TikTok export parsing
        run: |
          python - <<'PY'
          import io
          import json
          import zipfile

          import tiktok_portability

          payload = {
              "Posts": [
                  {
                      "Date": "2026-09-09",
                      "Title": "Owned post",
                      "Posted Video Download Link": "https://example.com/video.mp4",
                  }
              ]
          }
          archive = io.BytesIO()
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as zf:
              zf.writestr("Posts.json", json.dumps(payload))

          records = tiktok_portability.extract_posted_video_links(archive.getvalue())
          assert len(records) == 1
          assert records[0]["download_url"] == "https://example.com/video.mp4"
          assert records[0]["context"]["Title"] == "Owned post"
          assert tiktok_portability.choose_download_record(records, index=0) == records[0]
          print("Authorized TikTok portability parser OK")
          PY

      - name: Smoke-test DramaFren unified queue
        run: |
          python - <<'PY'
          from dramafren_queue import canonical_detail_url

          source = "https://dramabox.dramafren.org/index.php?ep=12&id=42000005228&lang=en&view=watch"
          detail = canonical_detail_url(source)
          assert "id=42000005228" in detail
          assert "lang=en" in detail
          assert "view=detail" in detail
          assert "ep=" not in detail
          print("DramaFren queue URL normalization OK")
          PY

      - name: Smoke-test library catalogue
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from library_db import LibraryDB

          with tempfile.TemporaryDirectory() as td:
              db = LibraryDB(Path(td) / "library.db")
              drama = db.upsert_drama(title="Test Drama", genres=["Drama"])
              same = db.upsert_drama(title="Test Drama", description="Updated")
              assert drama["id"] == same["id"]

              source = db.add_source(
                  drama_id=drama["id"],
                  platform="owned",
                  external_id="test-1",
                  status="owned_or_authorized",
              )
              episode = db.upsert_episode(drama_id=drama["id"], episode_number=1)
              db.link_episode_source(
                  episode_id=episode["id"],
                  source_id=source["id"],
                  status="owned_or_authorized",
              )
              file_record = db.register_file(
                  episode_id=episode["id"],
                  storage_provider="google_drive",
                  provider_file_id="drive-test-id",
                  sha256="a" * 64,
                  bytes_size=1234,
                  mime_type="video/mp4",
                  verified=True,
                  verification={"verified": True},
              )
              assert file_record["verified"] is True
              assert db.find_file_by_sha256("a" * 64)["id"] == file_record["id"]

              detail = db.get_drama(drama["slug"])
              assert detail is not None
              assert len(detail["episodes"]) == 1
              assert len(detail["episodes"][0]["files"]) == 1
              assert detail["episodes"][0]["files"][0]["verified"] is True
              assert db.list_dramas()[0]["verified_files"] == 1

          print("Library catalogue schema, dedupe, episode linking and file registration OK")
          PY

      - name: Import and smoke-test MCP server
        run: |
          python - <<'PY'
          import server
          health = server.health()
          assert health["ok"]
          assert health["source_policy"] == "clean-only"
          assert health["profile_scope"] == "all_public"
          print("Tokisclone MCP import and health OK")
          PY

      - name: Import REST API
        run: |
          python - <<'PY'
          import rest_api
          paths = {route.path for route in rest_api.routes}
          assert "/v1/tiktok/authorized/request" in paths
          assert "/v1/tiktok/authorized/status" in paths
          assert "/v1/tiktok/authorized/links" in paths
          assert "/v1/tiktok/authorized/download" in paths
          print("Tokisclone authorized TikTok REST routes import OK")
          PY

      - name: Import local worker and launcher
        run: |
          python - <<'PY'
          import ingest_local_media
          import local_worker
          import start_worker
          print("Tokisclone local worker + library ingest + launcher import OK")
          PY
