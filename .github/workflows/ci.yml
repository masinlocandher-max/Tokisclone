name: Tokisclone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements-minimal.txt
      - name: Compile Python
        run: python -m py_compile server.py drive_storage.py authorize_drive.py run_server.py
      - name: Import MCP server
        run: python -c "import server; print('Tokisclone import OK')"
