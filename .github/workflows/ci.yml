name: Tokisclone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: pip install -r requirements-minimal.txt
      - name: Compile Python
        run: python -m py_compile server.py drive_storage.py authorize_drive.py run_server.py process_job.py local_worker.py
      - name: Import and smoke-test MCP server
        run: python -c "import server; assert server.health()['ok']; print('Tokisclone MCP import and health OK')"
      - name: Import local worker
        run: python -c "import local_worker; print('Tokisclone local worker import OK')"
