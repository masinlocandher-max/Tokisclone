name: Tokisclone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: pip install -r requirements-minimal.txt

      - name: Compile Python
        run: >-
          python -m py_compile
          server.py
          drive_storage.py
          authorize_drive.py
          run_server.py
          media_core.py
          process_job.py
          local_worker.py

      - name: Smoke-test clean-source selector
        run: |
          python - <<'PY'
          from media_core import video_format_selector
          prefer = video_format_selector("best", "prefer-clean")
          strict = video_format_selector("best", "clean-only")
          assert "format_id!=download" in prefer
          assert "format_id!=download" in strict
          print("Clean-source selector OK")
          PY

      - name: Import and smoke-test MCP server
        run: python -c "import server; assert server.health()['ok']; print('Tokisclone MCP import and health OK')"

      - name: Import local worker
        run: python -c "import local_worker; print('Tokisclone local worker import OK')"
