name: Tokisclone Embedded Profile

on:
  push:
    branches: [main]
    paths:
      - "embedded-jobs/**/*.json"

permissions:
  contents: read

jobs:
  embedded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install transport
        run: pip install "curl-cffi>=0.16,<0.17"
      - name: Find jobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
            | grep -E '^embedded-jobs/.+\.json$' > /tmp/embedded-jobs.txt || true
          test -s /tmp/embedded-jobs.txt
      - name: Probe embedded state
        shell: bash
        run: |
          set -euo pipefail
          overall=0
          while IFS= read -r job; do
            name="$(basename "$job" .json)"
            profile_url="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["profile_url"])' "$job")"
            limit="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("limit",50))' "$job")"
            mkdir -p "output/$name"
            if ! python tiktok_embedded.py "$profile_url" --limit "$limit" --output "output/$name"; then
              overall=1
            fi
          done < /tmp/embedded-jobs.txt
          exit "$overall"
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokisclone-embedded-${{ github.sha }}
          path: output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
