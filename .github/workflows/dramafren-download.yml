name: DramaFren Public Download

on:
  push:
    branches: [main]
    paths:
      - "drama-jobs/**/*.json"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install browser and public extractor dependencies
        run: pip install "playwright>=1.55,<2" "yt-dlp>=2026.8.19"

      - name: Locate or install Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            python -m playwright install --with-deps chromium
          else
            echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
            "$CHROME_BIN" --version
          fi

      - name: Ensure ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe

      - name: Find changed drama jobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
            | grep -E '^drama-jobs/.+\.json$' > /tmp/drama-jobs.txt || true
          test -s /tmp/drama-jobs.txt
          cat /tmp/drama-jobs.txt

      - name: Resolve public media
        shell: bash
        run: |
          set -u
          overall=0
          while IFS= read -r job; do
            name="$(basename "$job" .json)"
            mkdir -p "output/$name"
            runner="dramafren_browser.py"
            if grep -Eq '"detail_url"[[:space:]]*:[[:space:]]*"https://dramafren\.org/' "$job"; then
              runner="dramafren_main_probe.py"
            fi
            echo "Using $runner for $job"
            if ! python "$runner" "$job" --output "output/$name"; then
              overall=1
            fi
          done < /tmp/drama-jobs.txt
          exit "$overall"

      - name: Upload resolver artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dramafren-${{ github.sha }}
          path: output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
